[package]
name = "prefset"
version = "0.1.0"
edition = "2024"
description = "Synchronize macOS preferences with one config file"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
indoc = "2.0.7"
plist = "1.10"
toml = { version = "1.1", features = ["preserve_order"] }
